# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-eventlooplayer"
BBFILE_PATTERN_meta-eventlooplayer = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-eventlooplayer = "6"

LAYERDEPENDS_meta-eventlooplayer = "core"
LAYERSERIES_COMPAT_meta-eventlooplayer = "scarthgap dunfell"
